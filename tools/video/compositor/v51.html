<!doctype html><html><head><meta charset="utf-8"><title>RTD v5 compositor</title>
<style>
@font-face{font-family:Inter;src:url('../fonts/InterVariable.woff2');font-weight:100 900}
@font-face{font-family:InterD;src:url('../fonts/InterDisplay-Bold.ttf');font-weight:700}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05090f;color:#F5F7FA;font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}
#root{position:absolute;inset:0;overflow:hidden;background:#05090f}
.layer{position:absolute;inset:0;overflow:hidden}
.photo{position:absolute;inset:0;overflow:hidden;display:none;background:#05090f}
.photo img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;will-change:transform;
  }
.photo .tint{display:none}
.photo .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,8,14,.50),rgba(3,8,14,.06) 58%),linear-gradient(0deg,rgba(3,8,14,.55),rgba(3,8,14,0) 34%)}
.ui{position:absolute;inset:0;display:none;background:#05090f}
.ui canvas{position:absolute;inset:0;width:1920px;height:1080px}
.ui .dim{position:absolute;inset:0;pointer-events:none}
.ui .ring{position:absolute;border:3px solid rgba(120,200,255,.95);border-radius:14px;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 0 26px 4px rgba(59,163,255,.55);opacity:0}
.gfx{position:absolute;inset:0;display:none;overflow:hidden}
.txt{position:absolute;white-space:nowrap;opacity:0;font-family:InterD,Inter,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.02;text-shadow:0 3px 6px rgba(0,0,0,.45),0 6px 44px rgba(0,0,0,.7);will-change:transform,opacity,filter}
.txt .w{display:inline-block;will-change:transform,opacity}
.txt.body{font-family:Inter;font-weight:600;letter-spacing:-.005em}
.txt.src{font-family:Inter;font-weight:500;letter-spacing:0;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.40) 100%);z-index:40}
#grain{position:absolute;inset:-64px;pointer-events:none;z-index:41;opacity:.05;background:url('../assets/grain.png');background-size:128px 128px;mix-blend-mode:overlay}
#floor{position:absolute;left:0;right:0;bottom:0;height:230px;pointer-events:none;z-index:42;background:linear-gradient(0deg,rgba(2,6,10,.60),rgba(2,6,10,0))}
#cap{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;text-align:center;padding:6px 22px 8px;border-radius:12px;background:rgba(3,7,12,.55);z-index:50;font-family:Inter;font-weight:600;font-size:40px;line-height:48px;color:#fff;white-space:nowrap;
  text-shadow:0 2px 3px rgba(0,0,0,.55),0 3px 22px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9);letter-spacing:-.005em}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}
.chipdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ff4d4d;margin-right:14px;vertical-align:middle;box-shadow:0 0 14px #ff4d4d}
.badge{position:absolute;right:56px;top:48px;z-index:30;padding:12px 22px;border-radius:999px;background:rgba(8,16,26,.82);border:1px solid rgba(255,178,36,.55);font:600 28px Inter;color:#FFB224;opacity:0;white-space:nowrap}
.chip{position:absolute;left:28px;top:96px;z-index:31;padding:8px 16px 8px 14px;border-radius:999px;background:rgba(6,12,20,.78);border:1px solid rgba(255,255,255,.18);font:600 24px Inter;color:#F5F7FA;white-space:nowrap;opacity:0}
.chip i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:10px;vertical-align:1px}
#dip{position:absolute;inset:0;background:#02050a;opacity:0;pointer-events:none;z-index:44}
.card{position:absolute;border-radius:24px;background:linear-gradient(160deg,rgba(22,40,58,.97),rgba(10,20,31,.97));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 24px 70px rgba(0,0,0,.55)}
</style></head><body>
<div id="root"></div><div id="vig"></div><div id="floor"></div><div id="flash"></div><div id="dip"></div><div id="grain"></div><div id="cap"></div><div id="fade"></div>
<script src="v51.js"></script></body></html>
